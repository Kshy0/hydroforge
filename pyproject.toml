[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "hydroforge"
version = "0.3.0"
description = "Generic framework for GPU-accelerated hydrological modelling"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Shengyu Kang", email = "kshy0204@whu.edu.cn"}
]
dependencies = [
    "pydantic>=2",
    "torch",
    "netCDF4",
    "numpy",
    "numba",
    "tqdm",
    "cftime",
    "scipy",
    "ninja; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/Kshy0/hydroforge"
Repository = "https://github.com/Kshy0/hydroforge"
Issues = "https://github.com/Kshy0/hydroforge/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["hydroforge*"]
namespaces = false

[tool.setuptools.package-data]
"hydroforge.kernels.toolchain" = ["*.mm"]
"hydroforge.kernels" = ["float32x2.metal", "emulated.metal"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.py[cod]"]

[project.optional-dependencies]
dev = ["ipykernel", "matplotlib", "ipympl", "pandas", "pytest", "ruff>=0.15"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
